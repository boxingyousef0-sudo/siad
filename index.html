<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سيد AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at top right,#291052,transparent 35%),
    radial-gradient(circle at bottom left,#071d4d,transparent 35%),
    #050509;
  color:white;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:1000px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(5,5,9,.78);
  backdrop-filter:blur(15px);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  box-shadow:0 0 25px rgba(124,58,237,.35);
}

.brand h1{
  font-size:19px;
}

.brand p{
  color:#8d8d9d;
  font-size:12px;
  margin-top:3px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9ca3af;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:25px 18px 125px;
  scroll-behavior:smooth;
}

.welcome{
  max-width:700px;
  margin:45px auto 30px;
  text-align:center;
}

.big-logo{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  box-shadow:0 0 45px rgba(124,58,237,.3);
}

.welcome h2{
  margin-top:20px;
  font-size:30px;
}

.welcome p{
  margin-top:10px;
  color:#9999a8;
  line-height:1.8;
  font-size:15px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  max-width:650px;
  margin:25px auto;
}

.suggestion{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:16px;
  color:#ddd;
  cursor:pointer;
  text-align:right;
  transition:.2s;
}

.suggestion:hover{
  background:rgba(124,58,237,.14);
  border-color:rgba(124,58,237,.45);
  transform:translateY(-2px);
}

.message{
  display:flex;
  margin:14px auto;
  max-width:820px;
}

.message.user{
  justify-content:flex-start;
}

.message.ai{
  justify-content:flex-end;
}

.bubble{
  max-width:75%;
  padding:13px 16px;
  border-radius:18px;
  line-height:1.8;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:15px;
}

.user .bubble{
  background:#202027;
  border:1px solid rgba(255,255,255,.07);
  border-bottom-left-radius:5px;
}

.ai .bubble{
  background:linear-gradient(135deg,#37206e,#172f73);
  border:1px solid rgba(124,58,237,.22);
  border-bottom-right-radius:5px;
}

.typing{
  display:none;
  max-width:820px;
  margin:14px auto;
  justify-content:flex-end;
}

.typing-box{
  padding:13px 17px;
  border-radius:18px;
  background:#171722;
}

.typing span{
  display:inline-block;
  width:6px;
  height:6px;
  background:#aaa;
  border-radius:50%;
  margin:0 2px;
  animation:bounce 1.2s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
  }
  30%{
    transform:translateY(-5px);
  }
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:15px;
  background:linear-gradient(
    transparent,
    rgba(5,5,9,.96) 30%
  );
}

.input-area{
  max-width:820px;
  margin:auto;
  display:flex;
  gap:9px;
  align-items:flex-end;
  padding:8px;
  border-radius:20px;
  background:rgba(22,22,30,.94);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}

textarea{
  flex:1;
  resize:none;
  max-height:130px;
  min-height:45px;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:15px;
  line-height:1.6;
  padding:11px 10px;
  font-family:inherit;
}

textarea::placeholder{
  color:#777783;
}

#send{
  width:45px;
  height:45px;
  border:0;
  border-radius:14px;
  color:white;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  font-size:20px;
  cursor:pointer;
}

#send:disabled{
  opacity:.45;
}

.actions{
  max-width:820px;
  margin:8px auto 0;
}

#clear{
  color:#777783;
  background:transparent;
  border:0;
  font-size:12px;
  padding:5px 8px;
  cursor:pointer;
}

@media(max-width:600px){

  header{
    padding:0 14px;
  }

  #chat{
    padding:15px 12px 125px;
  }

  .welcome{
    margin-top:30px;
  }

  .welcome h2{
    font-size:25px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .bubble{
    max-width:88%;
    font-size:14px;
  }

  .status{
    display:none;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">

    <div class="logo">س</div>

    <div>
      <h1>سيد AI</h1>
      <p>مساعدك الشخصي</p>
    </div>

  </div>

  <div class="status">
    <span class="dot"></span>
    متصل
  </div>

</header>


<main id="chat">

  <div class="welcome" id="welcome">

    <div class="big-logo">س</div>

    <h2>أهلاً بيك، أنا سيد 👋</h2>

    <p>
      أنا سيد، مساعدك الشخصي.
      اتكلم معايا واسألني عن أي حاجة.
    </p>

    <div class="suggestions">

      <div class="suggestion"
           onclick="useSuggestion('مين صنعك؟')">
        مين صنعك؟
      </div>

      <div class="suggestion"
           onclick="useSuggestion('عرفني بنفسك')">
        عرفني بنفسك
      </div>

      <div class="suggestion"
           onclick="useSuggestion('إيه مشروع سيد؟')">
        إيه مشروع سيد؟
      </div>

      <div class="suggestion"
           onclick="useSuggestion('إيه اللي تقدر تساعدني فيه؟')">
        إيه اللي تقدر تساعدني فيه؟
      </div>

    </div>

  </div>


  <div class="typing" id="typing">

    <div class="typing-box">

      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>

</main>


<div class="bottom">

  <div class="input-area">

    <textarea
      id="input"
      rows="1"
      placeholder="اكتب رسالتك لسيد..."
    ></textarea>

    <button id="send" onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="actions">

    <button id="clear" onclick="clearChat()">
      مسح المحادثة
    </button>

  </div>

</div>

</div>


<script>

const OPENAI_API_KEY = "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"


/*
بيانات سيد
*/

const SID_SYSTEM_PROMPT = `
أنت سيد، مساعد شخصي ذكي.

تحدث باللغة العربية المصرية الطبيعية عندما يكون ذلك مناسباً.

شخصيتك:

- ودود.
- ذكي.
- هادئ.
- طبيعي.
- واضح.
- تساعد المستخدم بدون تعقيد.
- لا تخترع معلومات.
- إذا لم تعرف شيئاً قل إنك لا تعرف.

معلومات المشروع:

اسمك: سيد.

أنت مساعد شخصي يتم تطويره كمشروع شخصي.

الشخص الذي يطورك هو يوسف.

إذا سألك المستخدم:
مين صنعك؟

قل:
تم تطويري بواسطة يوسف كمشروع شخصي، وما زلت في مرحلة التطوير والتجربة.

إذا سألك:
إيه مشروع سيد؟

اشرح أن الهدف هو بناء مساعد شخصي يتحدث مع صاحبه،
يفهم سياق المحادثات،
ويتم تطويره وإضافة قدرات جديدة له مع الوقت.

أسماء مرتبطة بالمشروع:

أستاذ ياسين.
أستاذ يوسف.

لا تخترع تفاصيل شخصية غير موجودة في المعلومات السابقة.

استخدم اللهجة المصرية عندما تكون مناسبة.
`;


const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const typing = document.getElementById("typing");
const welcome = document.getElementById("welcome");

let messages = [];
let busy = false;


/*
إضافة رسالة
*/

function addMessage(text,type){

  welcome.style.display = "none";

  const message = document.createElement("div");

  message.className =
    "message " +
    (type === "user" ? "user" : "ai");

  const bubble = document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  message.appendChild(bubble);

  chat.insertBefore(message,typing);

  chat.scrollTop = chat.scrollHeight;
}


/*
إظهار الكتابة
*/

function showTyping(){

  typing.style.display = "flex";

  chat.scrollTop = chat.scrollHeight;
}


/*
إخفاء الكتابة
*/

function hideTyping(){

  typing.style.display = "none";
}


/*
إرسال الرسالة
*/

async function sendMessage(){

  if(busy) return;

  const text = input.value.trim();

  if(!text) return;

  busy = true;

  send.disabled = true;

  addMessage(text,"user");

  messages.push({
    role:"user",
    content:text
  });

  input.value = "";

  input.style.height = "45px";

  showTyping();


  try{

    /*
    في النسخة الآمنة:
    الموقع يرسل الرسالة إلى Backend
    والـBackend يتعامل مع OpenAI.
    */

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        messages:messages,

        systemPrompt:SID_SYSTEM_PROMPT

      })

    });


    const data = await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "حدث خطأ في السيرفر"
      );

    }


    const reply =
      data.reply ||
      "مش عارف أرد دلوقتي.";


    hideTyping();

    addMessage(reply,"ai");


    messages.push({

      role:"assistant",

      content:reply

    });


  }catch(error){

    hideTyping();

    addMessage(
      "سيد لسه مش متوصل بالـBackend. الواجهة جاهزة، والخطوة التالية هي توصيل OpenAI بالسيرفر.",
      "ai"
    );

    console.error(error);

  }finally{

    busy = false;

    send.disabled = false;

    input.focus();

  }

}


/*
الاقتراحات الجاهزة
*/

function useSuggestion(text){

  input.value = text;

  sendMessage();

}


/*
مسح المحادثة
*/

function clearChat(){

  messages = [];

  document
    .querySelectorAll(".message")
    .forEach(element=>{
      element.remove();
    });

  welcome.style.display = "block";

  input.focus();
}


/*
Enter للإرسال
Shift + Enter لسطر جديد
*/

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
تكبير مربع الكتابة تلقائياً
*/

input.addEventListener(
  "input",
  function(){

    this.style.height = "45px";

    this.style.height =
      Math.min(
        this.scrollHeight,
        130
      ) + "px";

  }
);

</script>

</body>
  </html>
